<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Profissionais - Rede Vitta</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #4a154b;
      --primary-light: #6b21a8;
      --secondary: #00b894;
      --secondary-light: #e6f7f5;
      --accent: #00d2d3;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      background: #f3e8ff;
      color: var(--primary);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .brand-title { font-size: 1.3rem; font-weight: 800; color: var(--primary); line-height: 1.1; }
    .brand-subtitle { font-size: 0.8rem; color: var(--secondary); font-weight: 700; }

    .badge-location {
      background-color: var(--secondary-light);
      color: var(--secondary);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* Hero Section */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 40px 0;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
    }

    .hero-title {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .hero-title span {
      color: var(--secondary);
      display: block;
    }

    .hero-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 440px;
    }

    .hero-image-container {
      display: flex;
      justify-content: center;
      position: relative;
    }

    .hero-avatar-main {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7 0%, #00d2d3 100%);
      padding: 6px;
    }
    
    .hero-avatar-main img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
    }

    /* Filter Card */
    .filter-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .filter-group { display: flex; flex-direction: column; gap: 6px; }
    .filter-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .filter-input-wrapper i {
      position: absolute;
      left: 14px;
      color: var(--primary);
      font-size: 0.9rem;
    }

    .filter-group select, .filter-group input {
      width: 100%;
      padding: 12px 12px 12px 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background-color: #f8fafc;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .filter-group select:focus, .filter-group input:focus {
      border-color: var(--primary);
      background-color: #fff;
    }

    .btn-search {
      background-color: var(--secondary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .btn-search:hover { background-color: #00a082; }

    .btn-reset {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-reset:hover { color: var(--primary); }

    /* Results Header */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .results-count {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1rem;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .prof-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border);
    }

    .prof-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.1);
    }

    .prof-fav {
      position: absolute;
      top: 16px;
      right: 16px;
      color: #cbd5e1;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .prof-fav:hover { color: #ef4444; }

    .prof-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 16px;
      overflow: hidden;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #f8fafc;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .prof-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .prof-avatar i { font-size: 2.5rem; color: #94a3b8; }

    .prof-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .prof-profession {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .prof-spec {
      font-size: 0.8rem;
      color: var(--primary-light);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .prof-location {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 14px;
    }

    .prof-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .prof-tag {
      background: #f1f5f9;
      color: #475569;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
    }

    .prof-hours {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    .prof-actions {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
      margin-top: auto;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      font-size: 1.05rem;
      transition: opacity 0.2s;
    }

    .btn-icon:hover { opacity: 0.9; }
    .btn-wsp { background-color: #25d366; }
    .btn-eml { background-color: #ea4335; }
    .btn-ins { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

    footer {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-hospital-user"></i></div>
        <div>
          <div class="brand-title">Rede Vitta</div>
          <div class="brand-subtitle">Coworking Saúde</div>
        </div>
      </div>
      <div class="badge-location">
        <i class="fa-solid fa-location-dot"></i> Itapevi e Região
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- Hero Banner -->
    <div class="hero">
      <div>
        <h1 class="hero-title">Catálogo de<br><span>Profissionais</span></h1>
        <p class="hero-subtitle">Busque, conecte e transforme sua saúde e bem-estar com os melhores especialistas.</p>
      </div>
      <div class="hero-image-container">
        <div class="hero-avatar-main">
          <img src="https://images.unsplash.com/photo-1594824813566-78a9a441e8e2?auto=format&fit=crop&q=80&w=400" alt="Profissional da Saúde">
        </div>
      </div>
    </div>

    <!-- Filtros -->
    <div class="filter-card">
      <div class="filter-grid">
        
        <!-- 1. Profissão -->
        <div class="filter-group">
          <label>1. Profissão</label>
          <div class="filter-input-wrapper">
            <i class="fa-solid fa-user-doctor"></i>
            <select id="selectProfissao" onchange="aplicarFiltros()">
              <option value="">Todas as Profissões</option>
            </select>
          </div>
        </div>

        <!-- 2. Cidade -->
        <div class="filter-group">
          <label>2. Cidade</label>
          <div class="filter-input-wrapper">
            <i class="fa-solid fa-location-dot"></i>
            <select id="selectCidade" onchange="aplicarFiltros()">
              <option value="">Todas as Cidades</option>
            </select>
          </div>
        </div>

        <!-- 3. Especialidade -->
        <div class="filter-group">
          <label>3. Especialidade</label>
          <div class="filter-input-wrapper">
            <i class="fa-solid fa-stethoscope"></i>
            <select id="selectEspecialidade" onchange="aplicarFiltros()">
              <option value="">Todas as Especialidades</option>
            </select>
          </div>
        </div>

        <!-- 4. Serviços (Busca aberta) -->
        <div class="filter-group">
          <label>4. Serviços Prestados</label>
          <div class="filter-input-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="inputServicos" placeholder="Ex: Consulta, Pré-natal..." oninput="aplicarFiltros()">
          </div>
        </div>

        <!-- Botão de Ação -->
        <div style="display: flex; flex-direction: column;">
          <button class="btn-search" onclick="aplicarFiltros()">
            <i class="fa-solid fa-magnifying-glass"></i> Buscar
          </button>
          <button class="btn-reset" onclick="limparFiltros()">
            <i class="fa-solid fa-rotate-left"></i> Limpar filtros
          </button>
        </div>

      </div>
    </div>

    <!-- Resultados -->
    <div class="results-header">
      <div class="results-count" id="contadorResultados">Profissionais encontrados (0)</div>
    </div>

    <!-- Grid de Cards dos Profissionais -->
    <div class="cards-grid" id="gridProfissionais">
      <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
        Carregando profissionais da Rede Vitta...
      </div>
    </div>

  </div>

  <footer>
    Dados atualizados automaticamente via Google Sheets • Rede Vitta © 2026
  </footer>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQRSLkWdYOqO25SuyaGCdvfxKvoPXMRsWs9WBQ22Q_G64-DnHWdyWKEUbkbm8LirCKb0yZRT_Le-j5Q/pub?gid=1879601222&single=true&output=csv';

    let listaCompleta = [];

    function formatarUrlDrive(url) {
      if (!url) return '';
      const match = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w400`;
      }
      return url;
    }

    function parseCSV(text) {
      const p = textLine => {
        let arr = [''], i = 0, c = false;
        for (let ch of textLine) {
          if (ch === '"') { c = !c; }
          else if (ch === ',' && !c) { arr.push(''); i++; }
          else { arr[i] += ch; }
        }
        return arr;
      };

      const lines = text.split(/\r?\n/);
      const result = [];

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const cols = p(lines[i]).map(c => c.replace(/^"|"$/g, '').trim());

        if (cols.length >= 2) {
          let fotoUrl = '';
          cols.forEach(c => {
            if (c.includes('drive.google.com')) {
              fotoUrl = c;
            }
          });

          const segAsex = cols[13] || cols[12] || '';

          result.push({
            nome: cols[1] || '',
            cidade: cols[2] || '',
            profissao: cols[3] || 'Profissional da Saúde',
            especialidade: cols[4] || cols[3] || '',
            servicos: cols[5] || cols[4] || '',
            registro: cols[6] || '',
            bio: cols[7] || '',
            whatsapp: cols[9] ? cols[9].replace(/\D/g, '') : '',
            email: cols[10] || '',
            instagram: cols[11] ? cols[11].replace('@', '') : '',
            horario: segAsex && segAsex.toUpperCase() !== 'N/A' ? `Seg a Sex: ${segAsex}` : 'Horário a combinar',
            foto: formatarUrlDrive(fotoUrl)
          });
        }
      }
      return result;
    }

    async function carregarDados() {
      try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        listaCompleta = parseCSV(data);
        
        preencherFiltros();
        renderizarCards(listaCompleta);
      } catch (error) {
        console.error('Erro ao carregar dados:', error);
        document.getElementById('gridProfissionais').innerHTML = 
          '<div style="grid-column: 1/-1; text-align: center; color: red;">Erro ao carregar a lista de profissionais.</div>';
      }
    }

    function preencherFiltros() {
      const selectProf = document.getElementById('selectProfissao');
      const selectCid = document.getElementById('selectCidade');
      const selectEsp = document.getElementById('selectEspecialidade');

      const profissoes = new Set();
      const cidades = new Set();
      const especialidades = new Set();

      listaCompleta.forEach(p => {
        if (p.profissao) profissoes.add(p.profissao);
        if (p.cidade) cidades.add(p.cidade);
        if (p.especialidade) {
          p.especialidade.split(',').forEach(e => especialidades.add(e.trim()));
        }
      });

      profissoes.forEach(prof => selectProf.innerHTML += `<option value="${prof}">${prof}</option>`);
      cidades.forEach(cid => selectCid.innerHTML += `<option value="${cid}">${cid}</option>`);
      especialidades.forEach(esp => selectEsp.innerHTML += `<option value="${esp}">${esp}</option>`);
    }

    function renderizarCards(profissionais) {
      const grid = document.getElementById('gridProfissionais');
      const contador = document.getElementById('contadorResultados');
      grid.innerHTML = '';
      contador.innerText = `Profissionais encontrados (${profissionais.length})`;

      if (profissionais.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">
            Nenhum profissional encontrado com os filtros selecionados.
          </div>`;
        return;
      }

      profissionais.forEach(p => {
        const card = document.createElement('div');
        card.className = 'prof-card';

        // Avatar
        const avatarHTML = p.foto 
          ? `<img src="${p.foto}" alt="${p.nome}" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\\'fa-solid fa-user\\'></i>';">`
          : `<i class="fa-solid fa-user"></i>`;

        // Tags de Serviços
        const tagsArr = p.servicos ? p.servicos.split(',').slice(0, 3) : [];
        const tagsHTML = tagsArr.map(t => `<span class="prof-tag">${t.trim()}</span>`).join('');

        // Links de Contato
        let contatosHTML = '';
        if (p.whatsapp) {
          contatosHTML += `<a href="https://wa.me/55${p.whatsapp}" target="_blank" class="btn-icon btn-wsp" title="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>`;
        }
        if (p.email) {
          contatosHTML += `<a href="mailto:${p.email}" class="btn-icon btn-eml" title="E-mail"><i class="fa-solid fa-envelope"></i></a>`;
        }
        if (p.instagram) {
          contatosHTML += `<a href="https://instagram.com/${p.instagram}" target="_blank" class="btn-icon btn-ins" title="Instagram"><i class="fa-brands fa-instagram"></i></a>`;
        }

        card.innerHTML = `
          <i class="fa-regular fa-heart prof-fav"></i>
          <div class="prof-avatar">${avatarHTML}</div>
          <div class="prof-name">${p.nome}</div>
          <div class="prof-profession">${p.profissao}</div>
          ${p.especialidade ? `<div class="prof-spec">${p.especialidade}</div>` : ''}
          <div class="prof-location"><i class="fa-solid fa-location-dot"></i> ${p.cidade || 'Itapevi - SP'}</div>
          
          <div class="prof-tags">${tagsHTML}</div>

          <div class="prof-hours"><i class="fa-regular fa-clock"></i> ${p.horario}</div>

          <div class="prof-actions">${contatosHTML}</div>
        `;

        grid.appendChild(card);
      });
    }

    function aplicarFiltros() {
      const prof = document.getElementById('selectProfissao').value.toLowerCase();
      const cid = document.getElementById('selectCidade').value.toLowerCase();
      const esp = document.getElementById('selectEspecialidade').value.toLowerCase();
      const srv = document.getElementById('inputServicos').value.toLowerCase();

      const filtrados = listaCompleta.filter(p => {
        const matchProf = !prof || p.profissao.toLowerCase().includes(prof);
        const matchCid = !cid || p.cidade.toLowerCase().includes(cid);
        const matchEsp = !esp || p.especialidade.toLowerCase().includes(esp);
        const matchSrv = !srv || p.servicos.toLowerCase().includes(srv) || p.bio.toLowerCase().includes(srv);

        return matchProf && matchCid && matchEsp && matchSrv;
      });

      renderizarCards(filtrados);
    }

    function limparFiltros() {
      document.getElementById('selectProfissao').value = '';
      document.getElementById('selectCidade').value = '';
      document.getElementById('selectEspecialidade').value = '';
      document.getElementById('inputServicos').value = '';
      renderizarCards(listaCompleta);
    }

    window.onload = carregarDados;
  </script>
</body>
</html>
